[package]
name = "oblet"
version = "0.8.0"
description = "A lightweight standalone Markdown editor, Obsidian-theme compatible"
authors = ["lnabc03"]
edition = "2021"

[lib]
name = "oblet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tauri-plugin-dialog = "2.8.1"

# 桌面专属依赖（Android/iOS 不编译）：单实例为桌面插件；window-vibrancy 无移动端实现
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
