# tag 触发（v*）：Windows 构建 → 绿色 zip + 单 exe；Ubuntu 构建 → 安卓 arm64 APK
# 三个发行物全部上传到 GitHub Release
# 缓存：sccache（Rust 编译单元级） + rust-cache（依赖 registry/target） + npm cache
name: Release

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN 默认权限收紧后需显式声明：上传 release 资产要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - run: npm ci

      # 只产出绿色 exe（发行物是 zip + 单 exe；msi 安装包不做，跳过 bundling）
      - run: npm run tauri build -- --no-bundle

      # 组包 + 出口审计：干净暂存（exe + .github/ 下的 bat 源 + 现场收集的许可），
      # 与本地同一口径（release/ 不入库，干净检出没有那些文件，不能从那里拷贝）
      - name: Pack and audit zip
        run: |
          node .github/pack-zip.mjs
          node .github/audit-zip.mjs

      # 同时发布单 exe（方便直接下载），以版本号重命名
      - name: Copy standalone exe
        shell: bash
        run: |
          VER=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          cp src-tauri/target/release/oblet.exe "release/Oblet-${VER}-win-x64.exe"

      # 从 CHANGELOG.md 提取当前版本变更说明，作为 Release 正文（不再手动补 changelog）
      - name: Extract release notes
        run: node .github/extract-release-notes.mjs

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Oblet-*-win-x64.zip
            release/Oblet-*-win-x64.exe
          body_path: release/release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # 安卓 arm64 APK：gen/android 工程已入库，ubuntu-latest 预装 Android SDK/JDK17
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust (aarch64-android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      # NDK 版本对齐本地开发（27.2.x）；sdkmanager 不在 PATH，用绝对路径
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build APK (arm64 release)
        run: npm run tauri android build -- --apk --target aarch64

      # 侧载分发必须签名：CI 现场生成 debug 密钥签名（与本地 debug 签名同性质；
      # 将来若上架/正式签名，换 secrets 里的真实 keystore 即可）
      - name: Sign APK with CI debug key
        run: |
          keytool -genkeypair -v -keystore ci-debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Oblet CI,C=CN"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VER=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          mkdir -p release
          "$BT/apksigner" sign --ks ci-debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out "release/Oblet-${VER}-android-arm64.apk" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$BT/apksigner" verify "release/Oblet-${VER}-android-arm64.apk"

      # 第二 job 上传同一 release：action-gh-release 对已存在的 tag release 追加文件
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Oblet-*-android-arm64.apk
          token: ${{ secrets.GITHUB_TOKEN }}
