# tag 触发（v*）：Windows 构建 → 绿色 zip → 上传到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

# GITHUB_TOKEN 默认权限收紧后需显式声明：上传 release 资产要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # 只产出绿色 exe（发行物是 zip；msi 安装包不做，跳过 bundling）
      - run: npm run tauri build -- --no-bundle

      # 组包 + 出口审计：干净暂存（exe + .github/ 下的 bat 源 + 现场收集的许可），
      # 与本地同一口径（release/ 不入库，干净检出没有那些文件，不能从那里拷贝）
      - name: Pack and audit zip
        run: |
          node .github/pack-zip.mjs
          node .github/audit-zip.mjs

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Oblet-*-win-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
