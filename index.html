<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oblet</title>
    <!-- 启动过渡动画（原启动遮罩，设置项 transition_animation，默认关）：
         内联样式保证首帧即渲染（不等外部 CSS/JS bundle），
         遮盖 boot 期间的加载过程；main.ts 在 boot 结束后淡出移除 -->
    <style>
      #ob-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #1e1e2e; /* ctp-mocha-old base，与深色主题底色一致 */
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.18s ease;
      }
      /* 浅色主题（多主题一期）：splash-early.js 首帧前按 localStorage 镜像挂类，
         base 取自 theme-anuppuccin.css 的浅色 --ob-bg（238,230,221） */
      html.ob-theme-light #ob-splash {
        background: #eee6dd;
      }
      /* 二期：各主题 splash 底色（= 蒸馏产物的 --ob-bg；与 theme-classes.ts 的 splash 同步） */
      html.ob-t-atom #ob-splash { background: #272b34; }
      html.ob-t-atom.ob-theme-light #ob-splash { background: #fafafa; }
      html.ob-t-github #ob-splash { background: #0d1117; }
      html.ob-t-github.ob-theme-light #ob-splash { background: #ffffff; }
      html.ob-t-minimal #ob-splash { background: #262626; }
      html.ob-t-minimal.ob-theme-light #ob-splash { background: #ffffff; }
      html.ob-t-nord #ob-splash { background: #2e3440; }
      html.ob-t-nord.ob-theme-light #ob-splash { background: #ffffff; }
      html.ob-t-things #ob-splash { background: #1c2127; }
      html.ob-t-things.ob-theme-light #ob-splash { background: #ffffff; }
      #ob-splash.ob-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #ob-splash img {
        width: 96px;
        height: 96px;
        animation: ob-splash-breath 1.6s ease-in-out infinite;
      }
      @keyframes ob-splash-breath {
        0%, 100% { opacity: 0.45; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ob-splash img { animation: none; }
      }
      @media print {
        #ob-splash { display: none !important; }
      }
      /* 过渡动画关闭态：splash-early.js 首帧前挂类，彻底不渲染
         （reload 时窗口已可见，等 main.ts 异步摘除会闪一帧） */
      html.ob-no-splash #ob-splash { display: none !important; }
    </style>
    <script src="./splash-early.js"></script>
  </head>
  <!-- 主题类：默认 AnuPpuccin 深色作无 JS 兜底，运行时装配权在 JS
       （theme-classes.ts 注册表按设置 swap theme-*/ctp-flavor/ctp-accent/ob-t-* 类；
       anp-* 定制类是 AnuPpuccin 专属但常驻——其他主题下因主题文件的 ob-t-anuppuccin
       门控前缀不匹配而自动失效） -->
  <body class="theme-dark ctp-mocha-old ctp-accent-mauve ob-t-anuppuccin anp-current-line anp-callout-sleek anp-codeblock-edit-nowrap anp-color-transition-toggle anp-button-metadata-toggle anp-print anp-header-color-toggle anp-decoration-toggle anp-canvas-dark-bg anp-custom-vault-toggle anp-file-icons anp-simple-rainbow-title-toggle anp-simple-rainbow-collapse-icon-toggle anp-simple-rainbow-indentation-toggle anp-simple-rainbow-icon-toggle anp-rainbow-subfolder-color-toggle anp-disable-newtab-align anp-highlight-blue anp-simple-rainbow-color-toggle anp-mini-tab-toggle anp-h1-red anp-h2-peach anp-h3-green anp-h4-teal anp-h5-lavender anp-h6-mauve anp-bold-red anp-italic-green">
    <div id="ob-splash"><img src="./logo.png" alt="" /></div>
    <div id="app" class="app-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
